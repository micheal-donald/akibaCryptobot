services:
  bot:
    image: ${AKIBA_IMAGE:?Set the CI-published image digest}
    container_name: akiba-cryptobot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      AKIBA_PUBLIC_READ_ONLY: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    command: ["python", "start_bot.py", "--config", "/app/config/config.json", "--testnet", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - /opt/akibabot/data:/app/data
      - /opt/akibabot/logs:/app/logs
      - /opt/akibabot/models:/app/models
      - /opt/akibabot/models_staging:/app/models_staging
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
