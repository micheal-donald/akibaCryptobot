version: '3.8'

services:
  bot:
    build: .
    image: ghcr.io/${GITHUB_REPOSITORY:-akibacryptobot}:${VERSION:-latest}
    container_name: akiba-cryptobot
    restart: unless-stopped

    environment:
      # Trading configuration
      - TRADING_MODE=${TRADING_MODE:-paper}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Binance credentials (from .env or secrets)
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}

      # Telegram notifications
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # Risk management
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-0.05}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-0.02}
      - STOP_LOSS_PERCENT=${STOP_LOSS_PERCENT:-0.02}
      - TAKE_PROFIT_PERCENT=${TAKE_PROFIT_PERCENT:-0.04}

    volumes:
      # Persist logs and data
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: akibabot-network
