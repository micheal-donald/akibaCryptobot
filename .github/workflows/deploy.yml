name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GHCR image with Dokploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: container-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify image provenance
        id: image
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json, os, re
          metadata = json.load(open('image-metadata.json'))
          assert metadata['sha'] == os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'ghcr.io/micheal-donald/akibacryptobot@sha256:[a-f0-9]{64}', metadata['image'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + metadata['image'] + '\n')
          PY
      - name: Deploy through the local Dokploy API
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          test -n "$GHCR_PULL_TOKEN"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          ssh root@"$SERVER_IP" 'mkdir -p /opt/akibabot/deploy/dokploy /opt/akibabot/scripts'
          scp deploy/dokploy/compose.yml root@"$SERVER_IP":/opt/akibabot/deploy/dokploy/compose.yml
          scp scripts/dokploy_deploy.py scripts/freqtrade_deploy.py root@"$SERVER_IP":/opt/akibabot/scripts/
          printf '%s' "$GHCR_PULL_TOKEN" | ssh root@"$SERVER_IP" "python3 /opt/akibabot/scripts/freqtrade_deploy.py '$IMAGE'"
