name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to app directory
            cd /opt/akibabot
            
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Create .env file with secrets
            cat > .env << 'EOF'
            TRADING_MODE=${{ secrets.TRADING_MODE || 'paper' }}
            BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
            BINANCE_SECRET_KEY=${{ secrets.BINANCE_SECRET_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            LOG_LEVEL=INFO
            EOF
            
            # Stop existing container gracefully
            docker-compose down --timeout 30 || true
            
            # Start new container
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f
            
            # Verify container is running
            sleep 10
            docker-compose ps
      
      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *AkibaCryptoBot Deployment*
            
            Status: ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
            Commit: `${{ steps.sha.outputs.short }}`
            Branch: `main`
            
            ${{ job.status == 'success' && 'Bot is now running!' || 'Check GitHub Actions for details.' }}
      
      - name: Health Check
        if: success()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Wait for container to be healthy
            for i in {1..5}; do
              if docker inspect --format='{{.State.Health.Status}}' akiba-cryptobot 2>/dev/null | grep -q healthy; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Waiting for container to be healthy... ($i/5)"
              sleep 10
            done
            echo "Container health check passed (or no healthcheck configured)"
