name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy to Vultr (bare-metal)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync Files to Server via Rsync
        run: |
          rsync -avz --exclude='.git' --exclude='venv' --exclude='__pycache__' \
          --exclude='.pytest_cache' --exclude='logs/' --exclude='models/' \
          -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          ./ root@${{ secrets.SERVER_IP }}:/opt/akibabot/

      - name: Rebuild .env and Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.0
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE != '' && vars.TRADING_MODE || 'paper' }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TRADING_MODE,BINANCE_API_KEY,BINANCE_SECRET_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,VULTR_API_KEY
          script: |
            cd /opt/akibabot

            # Recreate .env with Action Secrets
            cat > .env << EOF
            TRADING_MODE=${TRADING_MODE}
            BINANCE_API_KEY=${BINANCE_API_KEY}
            BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
            VULTR_API_KEY=${VULTR_API_KEY}
            LOG_LEVEL=INFO
            EOF
            
            # Install any new dependencies
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Restart the bot service
            systemctl restart akibabot.service
            
            # Check status (first 5 seconds of logs to verify it loaded)
            sleep 5
            systemctl status akibabot.service --no-pager
            
      - name: Notify Telegram (Deployment Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *AkibaCryptoBot Deployment*
            
            Status: ✅ Success (Bare-Metal)
            Commit: `${{ steps.sha.outputs.short }}`
            Branch: `master`
            Host: `${{ secrets.SERVER_IP }}`
            
            Bot has been restarted via systemd.

      - name: Notify Telegram (Deployment Failed)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚨 *AkibaCryptoBot CI/CD Failed*
            
            Status: ❌ Failed to deploy to `${{ secrets.SERVER_IP }}`
            Commit: `${{ steps.sha.outputs.short }}`
            
            Check the GitHub Actions log for details.
