name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_portfolio_manager.py \
            --ignore=tests/test_config.py \
            --ignore=tests/test_akiba_crypto_bot.py

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify app starts without errors
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "
          from api.app import create_app
          app = create_app()
          routes = [r.path for r in app.routes]
          print('Registered routes:', routes)
          assert any('/api' in r for r in routes), 'No /api routes found'
          print('Smoke test passed')
          "

  image:
    name: Build and publish GHCR image
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate container imports
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            'from api.app import create_app; from strategies.ensemble_strategy import EnsembleStrategy; assert any(r.path == "/api/health" for r in create_app().routes)'
      - name: Publish validated image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable deployment image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          with open('image-metadata.json', 'w') as stream:
              json.dump({'image': os.environ['IMAGE_NAME'] + '@' + os.environ['IMAGE_DIGEST'], 'sha': os.environ['COMMIT_SHA']}, stream)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image-metadata.json
          retention-days: 30
