name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Validate Freqtrade paper deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Freqtrade image
        run: docker build -f deploy/freqtrade/Dockerfile -t akiba-test .
      - name: Test strategy and read-only boundary in the deployment runtime
        run: |
          docker run --rm --entrypoint python -w /app \
            -v "$PWD/tests/test_freqtrade_migration.py:/tmp/test_migration.py:ro" \
            akiba-test /tmp/test_migration.py -v
      - name: Validate deployment configuration
        run: |
          AKIBA_IMAGE=akiba-test docker compose -f deploy/dokploy/compose.yml config --quiet
          docker run --rm --entrypoint python -w /app akiba-test -c \
            'from pathlib import Path; from freqtrade.configuration import Configuration; from freqtrade.resolvers import StrategyResolver; from freqtrade.configuration.config_validation import validate_config_consistency; Path("/tmp/user_data").mkdir(); c=Configuration({"config":["/app/deploy/freqtrade/config.json"], "user_data_dir":"/tmp/user_data"}).get_config(); c["strategy_path"]="/app/deploy/freqtrade/strategies"; s=StrategyResolver.load_strategy(c); validate_config_consistency(c); assert s.stoploss == -0.03 and s.timeframe == "1h"'

  image:
    name: Build and publish GHCR image
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/freqtrade/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate container imports
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            'from deploy.freqtrade.portfolio import app; assert any(r.path == "/api/health" for r in app.routes)'
      - name: Publish validated image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/freqtrade/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable deployment image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          with open('image-metadata.json', 'w') as stream:
              json.dump({'image': os.environ['IMAGE_NAME'] + '@' + os.environ['IMAGE_DIGEST'], 'sha': os.environ['COMMIT_SHA']}, stream)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image-metadata.json
          retention-days: 30
