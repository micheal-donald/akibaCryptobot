<!DOCTYPE html>
<html lang="en" class="bg-black">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akibaCryptobot - Command Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'matrix-bg': '#000000',
                        'matrix-surface': '#0D1A15',
                        'matrix-neon': '#00FF41',
                        'matrix-dim': '#008F11',
                    },
                    fontFamily: {
                        'mono': ['VT323', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-matrix-bg text-matrix-neon font-mono h-screen w-screen overflow-hidden relative">

    <!-- Background Matrix Rain Canvas -->
    <canvas id="matrix" class="absolute inset-0 z-0 opacity-20"></canvas>

    <!-- Main Application UI -->
    <div class="relative z-10 w-full h-full p-4 flex flex-col">

        <!-- Header -->
        <header class="flex justify-between items-center border-b border-matrix-neon pb-2 mb-4">
            <h1 class="text-2xl neon-glow">akibaCryptobot v1.0.0</h1>
            <div class="flex items-center space-x-2">
                <span class="text-matrix-neon">STATUS: ONLINE</span>
                <span class="w-3 h-3 bg-matrix-neon rounded-full animate-pulse shadow-[0_0_8px_#00FF41]"></span>
            </div>
        </header>

        <!-- Terminal Window Container -->
        <main
            class="flex-grow border border-matrix-dim bg-matrix-surface/80 rounded-sm flex flex-col p-4 shadow-[0_0_15px_rgba(0,143,17,0.3)] backdrop-blur-sm">

            <!-- Top Vital Stats Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 border-b border-matrix-dim pb-4">
                <div class="flex flex-col">
                    <span class="text-matrix-dim text-sm">UPTIME</span>
                    <span class="text-xl" id="uptime">00:00:00</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-matrix-dim text-sm">ACTIVE PAIRS</span>
                    <span class="text-xl">BTC/USDT, ETH/USDT</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-matrix-dim text-sm">CURRENT PNL</span>
                    <span class="text-xl text-green-400">+ $142.50</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-matrix-dim text-sm">API LATENCY</span>
                    <span class="text-xl">42ms</span>
                </div>
            </div>

            <!-- Middle Live Log Feed -->
            <div class="flex-grow overflow-y-auto font-mono text-sm space-y-1 mb-4" id="terminal-feed">
                <!-- Logs injected via JS -->
            </div>

            <!-- Bottom Command Input -->
            <div class="flex items-center border-t border-matrix-dim pt-2 mt-auto">
                <span class="mr-2 text-matrix-neon">></span>
                <input type="text"
                    class="flex-grow bg-transparent border-none outline-none text-matrix-neon placeholder-matrix-dim"
                    placeholder="Enter command..." autofocus>
                <!-- Blinking block cursor effect in CSS -->
                <span class="blinking-cursor ml-1">█</span>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="matrix.js"></script>
    <script src="app.js"></script>
</body>

</html>
